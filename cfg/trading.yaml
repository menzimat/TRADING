# ============================================================
# Trading Configuration
#
# Central configuration for order entry defaults,
# price offsets, hotkey mappings, and reusable templates.
#
# TIF Notes
# ---------
# DAY
#     Normal regular-market trading (current default)
#
# DAY_EXT
#     Day + extended hours (premarket/after-hours)
#
# GTC
#     Good Till Cancelled
#
# GTC_EXT
#     GTC including extended hours
#
# For now we default to DAY while developing.
# ============================================================



defaults:

  side: BUY

  account: brokerage_account   # brokerage_account | hsa_account

  quantity:
    type: fixed          # fixed | risk | percent (SELL percent uses cached position)
    value: 100

  tif: DAY

  order_type: LIMIT

  price_basis: bid       # ask | bid | market

  price_offset: default


# ------------------------------------------------------------
# Named price offsets
# ------------------------------------------------------------

price_offsets:

  default:
    value: 0.01
    units: dollars       # dollars | percent | ticks

  aggressive:
    value: 0.02
    units: dollars

  passive:
    value: -0.05
    units: dollars

  market:
    value: 0
    units: dollars


# ------------------------------------------------------------
# Hotkey bindings
#
# Each hotkey invokes one template.
# ------------------------------------------------------------

hotkeys:

  shift+1:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 100
      price:
        offset: default

  shift+2:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 200
      price:
        offset: default

  shift+3:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 300
      price:
        offset: default

  shift+4:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 400
      price:
        offset: default

  shift+5:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 500
      price:
        offset: default

  shift+6:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 600
      price:
        offset: default

  shift+7:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 700
      price:
        offset: default

  shift+8:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 800
      price:
        offset: default

  shift+9:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 900
      price:
        offset: default

  shift+0:
    template: buy_limit
    overrides:
      quantity:
        type: fixed
        value: 1000
      price:
        offset: default

  ctrl+b: buy_limit

  ctrl+s: sell_limit

  ctrl+z: sell_limit_all

  ctrl+x: sell_limit_half

  ctrl+c: sell_limit_qtr

  ctrl+v: sell_limit_8th

  ctrl+f:
    action: FLATTEN
    
  esc:
    action: CANCEL_ALL

  ctrl+shift+q: panic

  ctrl+shift+u: refresh_quotes

# ------------------------------------------------------------
# Trade execution sounds
#
# Sounds are generated in memory at application startup.
# No sound files are loaded when a trade executes.
#
# type:
#   beep  = single fixed-frequency tone
#   boop  = downward frequency sweep
#   chime = two-tone sound
#
# Devices:
#   device: null # default
#   device: 11   #Jabra
#   device: 25   # PipeWire ALSA
#  
#
# ------------------------------------------------------------

sounds:

  enabled: true
  device: 25
  sample_rate: 48000

  # Maximum number of pending notifications.
  # The oldest notification is discarded if this is exceeded.
  queue_size: 8

  buy:
    type: chime
    frequency_hz: 880
    frequency2_hz: 1175
    duration_ms: 180
    volume: 0.30

  sell:
    type: boop
    frequency_hz: 520
    frequency2_hz: 390
    duration_ms: 180
    volume: 0.30


# ------------------------------------------------------------
# Reusable order templates
# ------------------------------------------------------------

templates:

  buy_limit:

    template_name: "buy_limit"

    template_display_name: "Buy Limit"

    side: BUY

    order_type: LIMIT

    quantity:
      type: fixed
      value: 100

    price:

      basis: bid

      offset: default

    tif: DAY


  sell_limit:
    template_name: "sell_limit"

    template_display_name: "Sell Limit"

    side: SELL

    order_type: LIMIT

    quantity:
      type: fixed
      value: 100

    price:

      basis: bid

      offset: default

    tif: DAY

  sell_limit_all:
    template_name: "sell_limit"

    template_display_name: "Sell Limit"

    side: SELL

    order_type: LIMIT

    quantity:
      type: percent
      value: 100

    price:

      basis: bid

      offset: default

    tif: DAY    

  sell_limit_half:
    template_name: "sell_limit_half"

    template_display_name: "Sell Limit Half"

    side: SELL

    order_type: LIMIT

    quantity:
      type: percent
      value: 50

    price:

      basis: bid

      offset: default

    tif: DAY

  sell_limit_qtr:
    template_name: "sell_limit_qtr"

    template_display_name: "Sell Limit Quarter"

    side: SELL

    order_type: LIMIT

    quantity:
      type: percent
      value: 25

    price:

      basis: bid

      offset: default

    tif: DAY

  sell_limit_8th:
      template_name: "sell_limit_8th"

      template_display_name: "Sell Limit 8th"

      side: SELL

      order_type: LIMIT

      quantity:
        type: percent
        value: 12.5

      price:

        basis: bid

        offset: default

      tif: DAY


  buy_market:
    template_name: "buy_market"

    template_display_name: "Buy Market"

    side: BUY

    order_type: MARKET

    quantity:
      type: fixed
      value: 100

    price:

      basis: market
      offset: market

    tif: DAY


  sell_market:
    template_name: "sell_market"

    template_display_name: "Sell Market"

    side: SELL

    order_type: MARKET

    quantity:
      type: fixed
      value: 100

    price:

      basis: market
      offset: market

    tif: DAY


  panic:

    action: PANIC_EXIT


  refresh_quotes:

    action: REFRESH_QUOTES


